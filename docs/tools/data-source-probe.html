<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据源联通性测试台</title>
<style>
:root{
  --bg:#10141a; --panel:#171d26; --panel2:#1d2530; --border:#2a3444;
  --fg:#d8e0ec; --muted:#8a96a8; --accent:#4ea1ff; --ok:#3ecf8e; --bad:#ff6b6b; --warn:#f0b429;
  --mono:"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:24px 16px 60px}
.wrap{max-width:1080px;margin:0 auto}
h1{font-size:22px;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.notice{background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--muted);margin-bottom:20px}
.notice b{color:var(--warn)}
.controls{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:26px}
.controls label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.controls input{background:var(--panel2);border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:13px;width:150px}
.controls input:focus{outline:1px solid var(--accent)}
.controls input.wide{width:230px}
h2{font-size:16px;margin:28px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border)}
h2 .tag{font-size:11px;color:var(--muted);font-weight:normal;margin-left:8px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
.card-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.card-head .name{font-size:15px;font-weight:600}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid}
.badge.role-main{color:var(--ok);border-color:var(--ok)}
.badge.role-cand{color:var(--accent);border-color:var(--accent)}
.badge.role-anchor{color:var(--warn);border-color:var(--warn)}
.badge.role-na{color:var(--muted);border-color:var(--muted)}
.status{font-size:11px;color:var(--muted);margin-left:auto}
.desc{font-size:13px;color:var(--muted);margin-bottom:10px}
.urlbox{background:#0c1016;border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-family:var(--mono);font-size:12px;word-break:break-all;margin-bottom:10px;color:#a8c7e8}
.meta{font-size:12px;color:var(--muted);margin-bottom:10px}
.meta b{color:var(--fg);font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{cursor:pointer;border-radius:6px;border:1px solid var(--border);background:var(--panel2);color:var(--fg);padding:7px 14px;font-size:13px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#0b1520;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
.result{margin-top:10px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;display:none;border-radius:6px;padding:8px 12px}
.result.ok{display:block;background:rgba(62,207,142,.08);border:1px solid rgba(62,207,142,.4);color:var(--ok)}
.result.bad{display:block;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.4);color:var(--bad)}
.card input.cfg{background:var(--panel2);border:1px solid var(--border);color:var(--fg);border-radius:5px;padding:4px 8px;font-family:var(--mono);font-size:12px;width:200px}
.tokrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;align-items:center;font-size:12px;color:var(--muted)}
</style>
</head>

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function curlFor(s,m){
  const r=s.build(m); if(!r)return"";
  let c=`curl -sS -m 15 -w '\\nHTTP %{http_code} · %{time_total}s\\n'`;
  for(const[k,v]of Object.entries(r.headers||{})) c+=` -H '${k}: ${v}'`;
  if(r.method==="POST") c+=` -X POST -d '${r.body}'`;
  c+=` '${r.url}'`;
  if(/gtimg\.cn\/q=/.test(r.url)) c+=" | iconv -f GBK -t UTF-8";
  return c;
}
function render(){
  const code=$("gCode").value.trim()||"600000", m=marketOf(code);
  const host=$("cards"); let html="",lastG="";
  for(const s of SOURCES){
    if(s.g!==lastG){html+=`<h2>${s.g}</h2>`;lastG=s.g}
    const role=`<span class="badge role-${s.role}">${s.roleTxt}</span>`;
    let body="";
    if(s.http===false){
      body=`<div class="desc">${s.desc}</div>`;
    }else{
      const r=s.build(m);
      const curl=curlFor(s,m);
      body=`<div class="desc">${s.desc}</div>
      ${r.note?`<div class="meta">💡 ${r.note}</div>`:""}
      ${r.method==="POST"?`<div class="meta"><b>POST body:</b> ${esc(r.body)}</div>`:""}
      ${Object.keys(r.headers||{}).length?`<div class="meta"><b>必要 Header:</b> ${Object.entries(r.headers).map(([k,v])=>k+": "+esc(v)).join(" · ")}</div>`:""}
      <div class="urlbox">${esc(r.url)}</div>
      <div class="btns">
        ${s.browserOk!==false?`<button class="primary" data-test="${SOURCES.indexOf(s)}">浏览器测连</button>`:""}
        <button data-copy="${SOURCES.indexOf(s)}">复制 curl 命令</button>
        <span class="status">探测频率克制：1-2 次即可</span>
      </div>
      <div class="result" id="res${SOURCES.indexOf(s)}"></div>`;
    }
    html+=`<div class="card"><div class="card-head"><span class="name">${s.name}</span>${role}<span class="status">${s.status}</span></div>${body}</div>`;
  }
  host.innerHTML=html;
  host.querySelectorAll("[data-test]").forEach(b=>b.onclick=()=>doTest(+b.dataset.test,m));
  host.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>doCopy(+b.dataset.copy,m,b));
}
async function doTest(i,m){
  const s=SOURCES[i],r=s.build(m),res=$("res"+i);
  res.className="result bad";res.style.display="block";res.textContent="测试中…";
  const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),12000);
  const t0=performance.now();
  try{
    await fetch(r.url,{mode:"no-cors",method:r.method||"GET",signal:ctrl.signal});
    const ms=Math.round(performance.now()-t0);
    res.className="result ok";
    res.textContent=`✔ 网络可达 · ${ms}ms\n（no-cors 模式读不到响应体；${Object.keys(r.headers||{}).some(k=>/Referer|User-Agent|Cookie/i.test(k))?"⚠ 本源需特殊 Header，浏览器测连可能假阴性——请用 curl 权威验证":"如需看真实数据请用 curl"}）`;
  }catch(e){
    res.textContent=`✘ 失败：${e.name==="AbortError"?"超时 12s":e.message}\n网络层不通或被拒——先换 curl 验证（可带必要 Header）再下结论`;
  }finally{clearTimeout(t)}
}
async function doCopy(i,m,btn){
  const cmd=curlFor(SOURCES[i],m);
  try{await navigator.clipboard.writeText(cmd);btn.textContent="已复制 ✓";setTimeout(()=>btn.textContent="复制 curl 命令",1200)}
  catch(e){const ta=document.createElement("textarea");ta.value=cmd;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();btn.textContent="已复制 ✓";setTimeout(()=>btn.textContent="复制 curl 命令",1200)}
}
["gCode","gStart","gEnd","gXq","gTs","gTd"].forEach(id=>$(id).addEventListener("input",render));
render();
</script>
